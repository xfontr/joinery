name: Bug
description: Something that worked is now wrong
labels: ["bug"]
body:
    - type: textarea
      id: description
      attributes:
          label: Description
          description: What is broken and where, in a sentence or two.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          value: |
              1.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behaviour
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behaviour
      validations:
          required: true
