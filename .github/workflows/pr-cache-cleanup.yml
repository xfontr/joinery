name: PR / Cache cleanup

# No other ref can restore a PR's caches, so once it closes they only take space from master's
on:
    pull_request:
        types: [closed]

permissions:
    actions: write

jobs:
    cleanup:
        runs-on: ubuntu-latest
        steps:
            - run: gh cache list --ref "refs/pull/$PR/merge" --limit 1000 --json id --jq '.[].id' | xargs -r -n1 gh cache delete
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
