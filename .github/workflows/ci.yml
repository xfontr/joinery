name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - uses: ./.github/actions/install

            - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
              with:
                  main-branch-name: master

            # Not an Nx target and deliberately not `affected`: the map indexes every project at
            # once, so "nothing changed here" is never a reason to skip it. Adding a script, hook,
            # workflow or skill without re-rendering fails this step.
            - run: pnpm docs:map --check

            # Not affected-scoped either. The version check needs a base, since on a push to master
            # a release commit moves every version.
            - run: pnpm invariants:check ${INVARIANTS_BASE:+--base="$INVARIANTS_BASE"}
              env:
                  INVARIANTS_BASE: ${{ github.event_name == 'pull_request' && env.NX_BASE || '' }}

            # Whole-repo too: a link breaks when its target moves, in a commit that touches no markdown
            - run: pnpm docs:verify

            # Whole-workspace too: an export goes unused when its last importer changes, not itself
            - run: pnpm unused:check

            # A PR restores only its own entries or master's, so a PR can never poison master's cache
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .nx/cache
                  key: nx-${{ github.sha }}
                  restore-keys: nx-

            # Coverage rather than plain tests, so a project falling below its thresholds fails here
            - run: pnpm exec nx affected --base="$NX_BASE" --head="$NX_HEAD" -t lint typecheck test:coverage build
              env:
                  NX_MAX_CACHE_SIZE: 2GB

    e2e:
        runs-on: ubuntu-latest
        # Ships the browsers, and its tag must equal @playwright/test's exact version in the catalog
        container:
            image: mcr.microsoft.com/playwright:v1.64.0-noble
            options: --user 1001
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - uses: ./.github/actions/install

            - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
              with:
                  main-branch-name: master

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .nx/cache
                  key: nx-${{ github.sha }}-e2e
                  restore-keys: |
                      nx-${{ github.sha }}
                      nx-

            - run: pnpm exec nx affected --base="$NX_BASE" --head="$NX_HEAD" -t test:e2e
              env:
                  NX_MAX_CACHE_SIZE: 2GB

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: playwright
                  # Off by default, and it would drop .playwright/ with each failure's error-context.md
                  include-hidden-files: true
                  path: |
                      apps/huella-legal/.playwright
                      apps/marina-roustan/.playwright
                      apps/portfolio/.playwright

    # PRs run only affected projects, so a red master push run reaches nobody unless it opens an issue.
    master-health:
        if: always() && github.event_name == 'push'
        needs: [checks, e2e]
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  title="master CI is red"
                  open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
                  if [ "$RESULT" = failure ]; then
                      if [ -n "$open" ]; then
                          gh issue comment "$open" --body "Still red: $RUN_URL"
                      else
                          gh issue create --title "$title" --label bug --label repo --body "A push run on master failed: $RUN_URL"
                      fi
                  elif [ -n "$open" ]; then
                      gh issue close "$open" --comment "Green again: $RUN_URL"
                  fi

    # Needs a base ref to diff against, so it's meaningless on a push to master.
    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Fails only on what the PR adds, so an advisory already on master never blocks it
            - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
              with:
                  fail-on-severity: high
                  comment-summary-in-pr: always
