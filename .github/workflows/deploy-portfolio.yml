name: Deploy · Portfolio

# After the portal's deploy rather than on push, because the build fetches the portal's
# `/embed/data.json` and a parallel run would read the previous one.
on:
    # Only a successful master push gets past the job's `if`, and the checkout is master, never the
    # triggering run's code.
    workflow_run: # zizmor: ignore[dangerous-triggers]
        workflows: [Deploy · Developer portal]
        types: [completed]
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-portfolio
    cancel-in-progress: false

jobs:
    deploy:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        environment:
            name: portfolio
            url: https://xifre-dev.pages.dev
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/install

            - name: Prerender the site
              run: pnpm exec nx build-static @joinery/portfolio
              env:
                  NUXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
                  NUXT_PUBLIC_DATA_URL: https://xfontr-monorepo.pages.dev/embed/data.json
                  # The prerender reads the live payload, which no task hash covers.
                  NX_SKIP_NX_CACHE: "true"

            - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: fb3cf13b48ae51ed991e8f95c68d173b
                  # The action `pnpm add`s a missing wrangler at the workspace root, which pnpm refuses.
                  workingDirectory: apps/portfolio
                  command: pages deploy .output/public --project-name=xifre-dev --branch=master
