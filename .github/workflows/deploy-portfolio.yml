name: Deploy · Portfolio

# After the portal's deploy rather than on push, because it publishes that run's portal build
# beneath `/portal/` and prerenders from its `/embed/data.json`.
on:
    # Only a successful master push gets past the job's `if`, and the checkout is master, never the
    # triggering run's code.
    workflow_run: # zizmor: ignore[dangerous-triggers]
        workflows: [Deploy · Developer portal]
        types: [completed]
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    # Downloads the portal build from the triggering run.
    actions: read

concurrency:
    group: deploy-portfolio
    cancel-in-progress: false

jobs:
    deploy:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        environment:
            name: portfolio
            url: https://xifre-dev.pages.dev
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/install

            - name: Find the portal build
              id: portal
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
              run: |
                  # A manual run takes the build from the portal's last successful master deploy.
                  if [ -z "$RUN_ID" ]; then
                      RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-developer-portal.yml \
                          --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')
                  fi
                  echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: developer-portal-site
                  path: ${{ runner.temp }}/portal
                  run-id: ${{ steps.portal.outputs.run-id }}
                  github-token: ${{ github.token }}

            # Left running for the prerender, which fetches the payload over HTTP.
            - name: Serve the portal build
              run: python3 -m http.server 4321 --directory "$RUNNER_TEMP/portal" > /dev/null 2>&1 &

            - name: Prerender the site
              run: pnpm exec nx build-static @joinery/portfolio
              env:
                  NUXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
                  NUXT_PUBLIC_DATA_URL: http://localhost:4321/embed/data.json
                  # The prerender reads the downloaded payload, which no task hash covers.
                  NX_SKIP_NX_CACHE: "true"

            - name: Put the portal beneath /portal/
              run: cp -R "$RUNNER_TEMP/portal" apps/portfolio/.output/public/portal

            - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: fb3cf13b48ae51ed991e8f95c68d173b
                  # The action `pnpm add`s a missing wrangler at the workspace root, which pnpm refuses.
                  workingDirectory: apps/portfolio
                  command: pages deploy .output/public --project-name=xifre-dev --branch=master
