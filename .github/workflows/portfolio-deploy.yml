name: Portfolio deploy

# Called by the portal's deploy once it has published, because the build fetches the portal's
# `/embed/data.json` and a parallel run would read the previous one.
on:
    workflow_call:
        secrets:
            CLOUDFLARE_API_TOKEN:
                required: true
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: portfolio-deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: portfolio
            url: https://xifre-dev.pages.dev
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/install

            - name: Prerender the site
              run: pnpm exec nx build-static @monorepo/portfolio
              env:
                  NUXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
                  NUXT_PUBLIC_DATA_URL: https://xfontr-monorepo.pages.dev/embed/data.json
                  # The prerender reads the live payload, which no task hash covers.
                  NX_SKIP_NX_CACHE: "true"

            - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: fb3cf13b48ae51ed991e8f95c68d173b
                  # The action `pnpm add`s a missing wrangler at the workspace root, which pnpm refuses.
                  workingDirectory: apps/portfolio
                  command: pages deploy .output/public --project-name=xifre-dev --branch=master
